<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Access Garnes and Clinitech">
    <title>Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e5e5e5;
        }

        main {
            display: flex;
            flex-direction: column;
            height: 100%;
            align-items: center;
            justify-content: center;
            gap: 3rem;
            padding: 3rem;
        }

        .company {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .logo-link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            background: #2d2d2d;
            border-radius: 24px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.15s ease, outline 0.15s ease;
            border: 2px solid transparent;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1.2;
        }

        .logo-link:hover {
            background: #363636;
            transform: scale(1.02);
        }

        .logo-link:focus {
            outline: 3px solid #4a9eff;
            outline-offset: 6px;
        }

        .logo-link:active {
            background: #242424;
            transform: scale(0.98);
        }

        .logo-link img {
            max-width: 450px;
            max-height: 300px;
            width: auto;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* Landscape orientation */
        @media (min-width: 1200px) and (orientation: landscape) {
            main {
                flex-direction: row;
                gap: 4rem;
            }

            .logo-link {
                max-width: 500px;
                aspect-ratio: auto;
            }

            .logo-link img {
                max-width: 350px;
                max-height: 250px;
            }
        }

        /* Tablet landscape */
        @media (max-width: 1199px) and (orientation: landscape) {
            main {
                flex-direction: row;
                gap: 2rem;
            }

            .logo-link {
                padding: 2rem;
                max-width: 400px;
            }

            .logo-link img {
                max-width: 280px;
                max-height: 200px;
            }
        }

        /* Portrait orientation (primary for tablet) */
        @media (orientation: portrait) {
            main {
                flex-direction: column;
                gap: 2.5rem;
                padding: 2rem;
            }

            .logo-link {
                padding: 2.5rem;
                max-width: 100%;
                aspect-ratio: 1.2;
            }

            .logo-link img {
                max-width: 350px;
                max-height: 220px;
            }
        }

        /* Respect user's motion preferences */
        @media (prefers-reduced-motion: reduce) {
            .logo-link {
                transition: background-color 0.15s ease;
            }

            .logo-link:hover {
                transform: none;
            }

            .logo-link:active {
                transform: none;
            }
        }

        /* Touch device optimization */
        @media (hover: none) {
            .logo-link {
                background: #252525;
            }

            .logo-link:active {
                background: #1f1f1f;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="company">
            <a href="https://garnes.is" class="logo-link" aria-label="Visit Garnes website">
                <img src="Assets/Header-Main_Garnes.png" alt="Garnes">
            </a>
        </div>

        <div class="company">
            <a href="https://clinitech.no" class="logo-link" aria-label="Visit Clinitech website">
                <img src="Assets/Clinitech_logo_RGB (2).png" alt="Clinitech">
            </a>
        </div>
    </main>
</body>
</html>
